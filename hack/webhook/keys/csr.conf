[ req ]
default_bits = 2048
prompt = no
default_md = sha256
req_extensions = req_ext
distinguished_name = dn

[ dn ]
CN = redis-cluster-webhook.redis.svc

[ req_ext ]
subjectAltName = @alt_names

[ alt_names ]
DNS.1 = redis-cluster-webhook
DNS.2 = redis-cluster-webhook.redis
DNS.3 = redis-cluster-webhook.redis.svc
