apiVersion: admissionregistration.k8s.io/v1beta1
kind: ValidatingWebhookConfiguration
metadata:
  name: redis-operator-validation-webhook
webhooks:
  - name: drc.redis.kun
    failurePolicy: Fail
    clientConfig:
      service:
        name: redis-cluster-webhook
        namespace: redis
        path: /validate-redis-kun-v1alpha1-distributedrediscluster
      caBundle: 
    rules:
      - operations:
          - DELETE
        apiGroups:
          - redis.kun
        apiVersions:
          - v1alpha1
        resources:
          - distributedredisclusters